name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # WebAssembly module: seam.js + seam.wasm
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.74
      - name: Build
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web -j
      - uses: actions/upload-artifact@v7
        with:
          name: seam-wasm
          path: web/dist/

  # React visualiser, built against the module from the wasm job
  web:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: seam-wasm
          path: web/dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Publishes the visualiser from main. A repo admin must first set Settings > Pages >
  # Source: GitHub Actions, then add the repository variable PAGES_ENABLED = true.
  pages:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
