name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # WebAssembly module: seam.js + seam.wasm
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Build
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web -j
      - uses: actions/upload-artifact@v4
        with:
          name: seam-wasm
          path: web/dist/

  # Tagged versions (v1.0.0, ...) get seam.js / seam.wasm / seam.d.ts attached to a GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: seam-wasm
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
